name: Test Atlas Validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for posting comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Atlas Markdown
        id: validate
        uses: pppdns/validate-atlas@main
        with:
          file_path: atlas.md
        continue-on-error: true

      - name: Read validation output
        if: always()
        id: read_output
        shell: bash
        run: |
          if [ -f "validation-output.txt" ]; then
            OUTPUT=$(cat validation-output.txt | head -100)
            echo "output<<EOF" >> $GITHUB_OUTPUT
            echo "$OUTPUT" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && steps.validate.outputs.has_errors == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.read_output.outputs.output }}`;
            const body = `## ❌ Atlas Validation Failed

            **File:** \`atlas.md\`

            <details>
            <summary>📋 Click to see all validation errors</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            Please fix the errors above and push new changes.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail workflow if validation errors exist
        if: steps.validate.outputs.has_errors == 'true'
        run: exit 1
