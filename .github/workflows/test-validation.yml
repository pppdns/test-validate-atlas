name: Test Atlas Validation

on:
  push:
    branches: [stable]
  pull_request:
    branches: [stable]

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Required for posting comments

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Validate Atlas Markdown
        id: validate
        uses: pppdns/validate-atlas@main
        with:
          file_path: atlas.md
        continue-on-error: true

      - name: Comment PR with validation results
        if: github.event_name == 'pull_request' && steps.validate.outputs.has_errors == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const output = `${{ steps.validate.outputs.validation_output }}`;
            const body = `## ❌ Atlas Validation Failed

            **File:** \`atlas.md\`

            <details>
            <summary>📋 Click to see all validation errors</summary>

            \`\`\`
            ${output}
            \`\`\`

            </details>

            Please fix the errors and push again.`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail if validation errors
        if: steps.validate.outputs.has_errors == 'true'
        run: exit 1
